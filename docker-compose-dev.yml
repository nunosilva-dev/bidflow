services:
  postgres:
    image: postgres:16-alpine
    container_name: bidflow-db-dev
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bidflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: bidflow-redis-dev
    restart: always
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]

  pgadmin:
    image: dpage/pgadmin4
    container_name: bidflow-pgadmin-dev
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bidflow.com
      PGADMIN_DEFAULT_PASSWORD: admin

volumes:
  postgres_data: