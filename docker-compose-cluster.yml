services:
  db:
    image: postgres:16-alpine
    container_name: bidflow-db-cluster
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bidflow

  redis:
    image: redis:7.2-alpine
    container_name: bidflow-redis-cluster
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]

  app-node-1:
    build: .
    container_name: bidflow-app-node-1
    restart: on-failure
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bidflow
      SPRING_DATA_REDIS_HOST: redis

  app-node-2:
    build: .
    container_name: bidflow-app-node-2
    restart: on-failure
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bidflow
      SPRING_DATA_REDIS_HOST: redis

  nginx-lb:
    image: nginx:alpine
    container_name: bidflow-nginx-lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-node-1
      - app-node-2