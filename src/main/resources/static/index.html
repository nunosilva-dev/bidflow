<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidFlow | Real-Time Auction</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            background: #E5E7EB;
            padding: 6px 12px;
            border-radius: 9999px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-badge.connected {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-badge.connected .status-dot {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-badge.error {
            background: #FEE2E2;
            color: #991B1B;
        }

        .status-badge.error .status-dot {
            background-color: var(--danger);
        }

        .auction-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-header {
            padding: 24px;
            border-bottom: 1px solid #F3F4F6;
        }

        .auction-id {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .item-title {
            margin: 4px 0 0 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .price-section {
            padding: 40px 24px;
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, #fafafa);
        }

        .price-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .current-price {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.05em;
            transition: color 0.3s ease, transform 0.1s;
            display: inline-block;
        }

        .current-price.updated {
            color: var(--success);
            transform: scale(1.05);
        }

        /* Controls */
        .controls {
            padding: 24px;
            background: #F9FAFB;
            border-top: 1px solid #F3F4F6;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-bid {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-bid:hover {
            background-color: var(--primary-hover);
        }

        .btn-bid:active {
            transform: translateY(1px);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
            font-weight: 500;
        }

        /* Logs */
        .activity-feed {
            margin-top: 30px;
        }

        .feed-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.3s ease-out;
            border-left: 3px solid transparent;
        }

        .feed-item.bid {
            border-left-color: var(--success);
        }

        .feed-item.error {
            border-left-color: var(--danger);
        }

        .feed-time {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .feed-amount {
            font-weight: 700;
            color: var(--text-main);
        }

        .feed-user {
            color: var(--primary);
            font-weight: 600;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">BidFlow</div>
        <div id="connectionStatus" class="status-badge">
            <div class="status-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="auction-card">
        <div class="card-header">
            <div class="auction-id">Auction #<span id="auctionIdDisplay">1</span></div>
            <h1 class="item-title" id="auctionTitle">Loading Item...</h1>
        </div>

        <div class="price-section">
            <div class="price-label">Current Highest Bid</div>
            <div id="currentPrice" class="current-price">---</div>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="username" class="form-control" placeholder="Username" value="Guest">
                <input type="number" id="bidAmount" class="form-control" placeholder="Amount" step="10">
            </div>
            <button onclick="placeBid()" class="btn-bid">Place Bid</button>
            <div id="errorMsg" class="error-message"></div>
        </div>
    </div>

    <div class="activity-feed">
        <div class="feed-title">Live Activity</div>
        <div id="feedList" class="feed-list">
        </div>
    </div>
</div>

<script>
    const AUCTION_ID = 1;
    const SOCKET_ENDPOINT = '/bidflow/ws';
    const API_BASE = '/bidflow/auctions';

    let stompClient = null;
    let currentHighestBid = 0;

    function init() {
        document.getElementById('username').value = 'User-' + Math.floor(Math.random() * 1000);

        connectWebSocket();
        loadInitialData();
    }

    function loadInitialData() {
        fetch(`${API_BASE}/${AUCTION_ID}`)
            .then(res => {
                if (!res.ok) throw new Error("Auction not found");
                return res.json();
            })
            .then(data => {
                document.getElementById('auctionTitle').innerText = data.title;
                document.getElementById('auctionIdDisplay').innerText = data.id;
                updatePriceDisplay(data.currentPrice);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('auctionTitle').innerText = "Auction Not Found";
                document.getElementById('errorMsg').innerText = "Could not load auction data. Check backend.";
            });
    }

    function connectWebSocket() {
        const socket = new SockJS(SOCKET_ENDPOINT);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            setConnectionStatus(true);
            console.log('Connected: ' + frame);

            stompClient.subscribe(`/topic/auctions/${AUCTION_ID}`, function (message) {
                const notification = JSON.parse(message.body);
                handleNewBid(notification);
            });

            stompClient.subscribe('/user/queue/errors', function (message) {
                const errorBody = JSON.parse(message.body);
                showError(errorBody.message);
            });

        }, function (error) {
            setConnectionStatus(false);
            console.error('STOMP Error:', error);
        });
    }

    function placeBid() {
        const amountInput = document.getElementById('bidAmount');
        const usernameInput = document.getElementById('username');
        const errorDiv = document.getElementById('errorMsg');

        const amount = parseFloat(amountInput.value);
        const username = usernameInput.value.trim();

        errorDiv.innerText = '';
        if (!username) {
            showError("Username is required");
            return;
        }
        if (isNaN(amount) || amount <= 0) {
            showError("Invalid amount");
            return;
        }

        const bidRequest = {
            auctionId: AUCTION_ID,
            bidderUsername: username,
            amount: amount
        };

        if (stompClient && stompClient.connected) {
            stompClient.send("/app/bid", {}, JSON.stringify(bidRequest));
        } else {
            showError("Not connected to server.");
        }
    }

    function handleNewBid(notification) {
        updatePriceDisplay(notification.amount);

        addLogEntry({
            type: 'bid',
            user: notification.bidderUsername,
            amount: notification.amount,
            time: new Date()
        });
    }

    function updatePriceDisplay(amount) {
        currentHighestBid = amount;
        const priceEl = document.getElementById('currentPrice');

        priceEl.innerText = new Intl.NumberFormat('en-US', {
            style: 'currency', currency: 'USD'
        }).format(amount);

        document.getElementById('bidAmount').value = (amount + 10).toFixed(2);

        priceEl.classList.remove('updated');
        void priceEl.offsetWidth;
        priceEl.classList.add('updated');
    }

    function showError(msg) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = msg;

        addLogEntry({
            type: 'error',
            message: msg,
            time: new Date()
        });

        setTimeout(() => {
            if (errorDiv.innerText === msg) errorDiv.innerText = '';
        }, 5000);
    }

    function setConnectionStatus(isConnected) {
        const badge = document.getElementById('connectionStatus');
        const text = document.getElementById('statusText');

        if (isConnected) {
            badge.className = 'status-badge connected';
            text.innerText = 'Live';
        } else {
            badge.className = 'status-badge error';
            text.innerText = 'Disconnected';
        }
    }

    function addLogEntry(data) {
        const list = document.getElementById('feedList');
        const item = document.createElement('div');
        item.className = `feed-item ${data.type}`;

        const timeStr = data.time.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});

        if (data.type === 'bid') {
            const amountStr = new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD'}).format(data.amount);
            item.innerHTML = `
                <div>
                    <span class="feed-user">${data.user}</span> placed a bid
                    <div class="feed-time">${timeStr}</div>
                </div>
                <div class="feed-amount">${amountStr}</div>
            `;
        } else {
            item.innerHTML = `
                <div>
                    <span style="font-weight:600">Error</span>: ${data.message}
                    <div class="feed-time">${timeStr}</div>
                </div>
            `;
        }

        list.prepend(item);

        if (list.children.length > 10) {
            list.removeChild(list.lastChild);
        }
    }

    init();

</script>
</body>
</html>
