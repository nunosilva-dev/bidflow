spring.application.name=BidFlow
server.servlet.context-path=/bidflow
# WebSocket Configuration
bidflow.ws.endpoint=/ws
bidflow.ws.broker-prefix=/topic
bidflow.ws.app-prefix=/app
# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/bidflow
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Redis Configuration (Defaults for local run without Docker env vars)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Virtual Threads (Spring Boot 3.2+ / 4.x)
spring.threads.virtual.enabled=true